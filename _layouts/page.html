---
layout: default
---

<section class="page-hero">
  <div class="page-hero-inner">
    {% if page.tag %}<p class="hero-tag">{{ page.tag }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-hero-sub">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>

<div class="page-content-wrap">
  <div class="page-content">
    {{ content }}
  </div>
</div>
